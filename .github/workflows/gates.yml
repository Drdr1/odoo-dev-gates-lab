name: gates

on:
  pull_request:
    branches: [main, staging, production]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # "gates" is the required status check named in rulesets/*.json.
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Pull request metadata (GIT-03, GIT-04, GIT-05)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python tools/pr_meta.py

      - name: Odoo gates (ODO-01 to ODO-08, GIT-07)
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python tools/odoo_gates.py --base "origin/$BASE_REF"
          else
            python tools/odoo_gates.py
          fi

      - name: pylint-odoo
        if: ${{ !cancelled() }}
        run: |
          pip install --quiet --require-hashes -r requirements-ci.txt
          pylint --rcfile=.pylintrc addons

  # The gates test themselves: every seeded violation must still be rejected.
  selftest:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Seeded violations are rejected, clean changes are accepted
        run: |
          pip install --quiet --require-hashes -r requirements-ci.txt
          python -m pytest tests_gates -v
